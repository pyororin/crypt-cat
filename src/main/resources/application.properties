spring.application.name=crypt-cat
server.port=${PORT:8080}
spring.profiles.active=production
project.id=your-gcp-project-id
coincheck.host=https://coincheck.com
coincheck.amount=${SELL_BUY_AMOUNT:0.0055}
coincheck.price=${SELL_BUY_PRICE:55000}
coincheck.actually=${IS_ACTUALLY_SELL_BUY:false}
coincheck.interval=3
coincheck.retry.delay-min=${RETRY_DELAY:1}
coincheck.retry.delay-sec=${RETRY_DELAY_SEC:60}
coincheck.retry.limit-count=${RETRY_LIMIT_COUNT:2}
# HIGH / MIDIUM / LOW / EVEN
coincheck.order-logic=HIGH
allowed.ips=203.0.113.1,203.0.113.2
