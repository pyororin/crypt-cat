spring.application.name=crypt-cat
server.port=${PORT:8080}
spring.profiles.active=production
project.id=your-gcp-project-id
coincheck.host=https://coincheck.com
coincheck.amount=${SELL_BUY_AMOUNT:0.005}
coincheck.price=${SELL_BUY_PRICE:50000}
coincheck.actually=${IS_ACTUALLY_SELL_BUY:false}
coincheck.interval=${ORDER_INTERVAL:5}
coincheck.cancel-delay-minutes=${CANCEL_DELAY_MINUTES:600}
coincheck.retry.delay-sec=${RETRY_DELAY_SEC:20}
coincheck.retry.limit-count=${RETRY_LIMIT_COUNT:5}
# HIGH / MEDIUM / LOW / EVEN
coincheck.order-logic=MEDIUM
allowed.ips=203.0.113.1,203.0.113.2
